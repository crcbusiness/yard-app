<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- EXPERIMENT: the page had no title at all, so Telegram fell back to the
     BotFather name in the minimised bar. If that bar now reads "Yard
     Pre-Inspection", Telegram mirrors this and the sync status can live
     there. Delete this line to go back. -->
<title>Yard Pre-Inspection</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d222b; --line:#262b36; --txt:#e8eaed; --dim:#9aa3b2;
    --accent:#3b82f6; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --tap:52px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button{font-family:inherit}
  header{position:sticky;top:0;z-index:20;background:#0f1115f2;backdrop-filter:blur(10px);
         border-bottom:1px solid var(--line);padding:10px 14px}
  .hrow{display:flex;align-items:center;gap:10px}
  h1{font-size:17px;margin:0;font-weight:650;flex:1}
  .who{font-size:11px;color:var(--dim);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon{background:none;border:none;color:var(--dim);font-size:19px;padding:2px 4px}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{flex:1;padding:9px 4px;border:1px solid var(--line);background:transparent;color:var(--dim);
       border-radius:9px;font-size:13px;font-weight:600}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:12px 14px 96px}

  .search{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
          background:var(--card);color:var(--txt);font-size:16px;margin-bottom:9px}
  .sortbar{display:flex;gap:7px;margin-bottom:12px}
  .sortbar button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);
        color:var(--dim);border-radius:9px;font-size:13px;font-weight:700}
  .sortbar button.on{background:var(--card2);border-color:var(--accent);color:var(--txt)}

  .ghead{display:flex;align-items:center;gap:9px;margin:20px 0 9px;font:800 11px/1 inherit;
         color:var(--dim);letter-spacing:1px}
  .ghead:first-child{margin-top:2px}
  .ghead .ln{flex:1;height:1px;background:var(--line)}
  .ghead .n{color:#6b7480;font-weight:700;letter-spacing:.4px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:12px 13px;margin-bottom:9px;display:block;width:100%;text-align:left;color:inherit}
  .card:active{border-color:var(--accent)}
  .vin{font:600 17px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
  .vin .t{color:var(--accent)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .pill{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.5px}
  .p-PENDING{background:#3a2f10;color:#fbbf24}
  .p-PROGRESS{background:#123047;color:#60a5fa}
  .p-DONE{background:#0d3327;color:#34d399}
  .p-MISSING{background:#3d2a12;color:#fbbf24;border:1px solid #7c5a1e}
  .p-REMOVED{background:#2a2e37;color:#98a2b3}
  .p-OFFSITE{background:#33291a;color:#d9a441}
  .p-DAMAGE{background:#3d1414;color:#f87171}
  .p-REQUESTED{background:#12304a;color:#7dd3fc}
  .p-APPROVED{background:#0d3327;color:#34d399}
  .p-DOCS{background:#3a2410;color:#fdba74}
  /* who inspected it and when, nested under the VIN it belongs to */
  .insp{font-size:11.5px;line-height:1.3;color:var(--dim);margin-top:6px}
  .insp b{color:#c9d2da;font-weight:650}

  /* read-only inspection summary shown when a VIN is opened from Eval */
  .why{background:#1c1418;border:1px solid #40232a;border-radius:10px;padding:12px 14px;margin-bottom:16px}
  .why h5{margin:0 0 8px;font:800 10.5px/1 inherit;letter-spacing:1px;color:#f87171;text-transform:uppercase}
  .why ul{margin:0;padding-left:17px;color:#e8c4c4;font-size:14px}
  .why li{margin-bottom:3px}
  .rtab{width:100%;border-collapse:collapse;margin-top:2px}
  .rtab tr{border-bottom:1px solid var(--line)}
  .rtab tr:last-child{border-bottom:none}
  .rtab td{padding:10px 0;font-size:14.5px;vertical-align:top}
  .rtab td:first-child{color:var(--dim);width:44%;font-weight:600}
  .rtab td:last-child{text-align:right;font-weight:650}
  .rtab td.bad{color:#f87171}
  .rtab td.none{color:#5b6472;font-weight:500}
  .unlockbtn{width:100%;min-height:48px;margin-top:18px;border:1px dashed var(--accent);
             background:transparent;color:var(--accent);border-radius:10px;
             font-size:14.5px;font-weight:700}

  .facts{display:flex;gap:18px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
  .fact{min-width:0}
  .fact .k{font-size:9.5px;color:var(--dim);font-weight:800;letter-spacing:.9px;margin-bottom:2px}
  .fact .v{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fact .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.4px}
  .fact .v.none{color:#5b6472;font-weight:500;font-family:inherit;letter-spacing:0}

  /* ---- loads ---- */
  .loadcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
        margin-bottom:11px;overflow:hidden;position:relative}
  /* state reads off the left edge before you read a word of it */
  .loadcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warn)}
  .loadcard.ready::before{background:var(--ok)}
  .loadcard.signed::before{background:var(--accent)}
  .loadcard.open{border-color:var(--accent)}
  /* A load with nothing left to inspect now sorts to the top, so it should
     also read as finished-bar-one-tap before anything is actually read. The
     open state still wins the border — that is where his thumb is. */
  .loadcard.ready:not(.open){border-color:#1f6b4a}
  .loadcard.ready .lid{color:#4ade80}
  .lhead{padding:14px 15px 14px 17px}
  .lrow{display:flex;align-items:center;gap:10px}
  .lid{font:700 20px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;flex:1;
       letter-spacing:.5px;color:var(--txt)}
  .lcount{font:700 14px/1 ui-monospace,monospace;color:var(--txt);letter-spacing:.5px}
  .caret{color:var(--dim);font-size:12px;margin-left:4px}
  .prog{height:8px;border-radius:5px;background:#0a0c0f;margin-top:11px;overflow:hidden;
        border:1px solid #23282f}
  .prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
  .lmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .lchip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:6px;letter-spacing:.4px}
  .c-pending{background:#4a3a10;color:#fcd34d}
  .c-ready{background:#0f3d2e;color:#4ade80}
  .c-missing{background:#4a3512;color:#fbbf24}
  .c-damage{background:#4a1717;color:#fca5a5}
  .c-info{background:var(--card2);color:#b3bcc6;font-weight:600;letter-spacing:.2px}

  .lvins{border-top:1px solid var(--line);padding:2px 12px 13px 15px;background:#13161c}
  .lvin{display:block;padding:12px 2px;border-bottom:1px solid #232830}
  .lvin:last-of-type{border-bottom:none}
  .lv-vin{display:block;font:600 15px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;
          letter-spacing:.6px;color:var(--txt);word-break:break-all}
  .lv-sub{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:7px}
  .lv-bay{font:700 13px/1 ui-monospace,monospace;color:#c9d2da;letter-spacing:.7px}
  .lcomplete{width:100%;min-height:50px;margin-top:14px;border-radius:10px;border:none;
             font-size:15px;font-weight:700}
  .lcomplete.go{background:var(--ok);color:#04150e}
  .lcomplete.wait{background:#1f242b;border:1px solid var(--line);color:#8f99a4}
  .signoff{margin-top:14px;text-align:center;font-size:13.5px;color:#4ade80;font-weight:700;
           background:#0f3d2e;border-radius:8px;padding:11px 12px}

  .collapse{width:100%;display:flex;align-items:center;gap:10px;margin:22px 0 10px;
            padding:13px 14px;border:1px solid var(--line);background:var(--card);
            color:var(--dim);border-radius:10px;font:800 11px/1 inherit;letter-spacing:1px;
            text-transform:uppercase}
  .collapse.open{border-color:var(--ok);color:#34d399}
  .collapse span:first-child{flex:1;text-align:left}
  .collapse .cn{background:var(--card2);color:#b3bcc6;border-radius:20px;padding:3px 9px;
                font-size:11px;letter-spacing:.3px}
  .collapse .cv{font-size:10px}

  /* ---- form ---- */
  .back{background:none;border:none;color:var(--accent);font-size:15px;padding:0;margin-bottom:10px}
  .grp{margin-bottom:18px}
  .lab{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.7px;
       text-transform:uppercase;margin-bottom:7px}
  .seg{display:flex;gap:7px;flex-wrap:wrap}
  .seg button{flex:1;min-width:68px;min-height:var(--tap);border:1px solid var(--line);
              background:var(--card);color:var(--txt);border-radius:10px;font-size:14px;font-weight:600}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .seg button.on.no{background:#374151;border-color:#4b5563}
  .seg button.on.bad{background:var(--bad);border-color:var(--bad)}
  .seg button.on.ok{background:var(--ok);border-color:var(--ok);color:#04150e}
  input[type=text],textarea{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);
       background:var(--card);color:var(--txt);font-size:16px}
  textarea{min-height:76px;resize:vertical}
  .tworow{display:flex;gap:14px}
  .tworow > div{flex:1;min-width:0}
  .tworow .seg button{min-width:0;font-size:13px}
  /* Documents: name on its own line, three full-width answers under it.
     "VIN DISCREPANCY" does not fit beside a label on a phone. */
  .docrow{margin-bottom:12px}
  .docrow .name{font-size:15px;font-weight:600;margin-bottom:7px}
  .docrow .seg button{min-width:0;min-height:48px;font-size:12px;line-height:1.15;
                      padding:6px 4px;hyphens:auto;overflow-wrap:anywhere}

  /* ---- bay: prefix from the sheet + tap the last digit ---- */
  .baycode{font:700 30px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;
           text-align:center;padding:4px 0 2px}
  .baycode .miss{color:var(--warn)}
  .baycode.done{color:var(--ok)}
  .baycode.wait{color:var(--txt)}
  .bayhint{font-size:12px;color:#6b7480;margin-top:8px;text-align:center}
  .bayhint.warn{color:var(--warn)}
  .digits{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
  .dig{min-height:50px;border:1px solid var(--line);background:var(--card);color:var(--txt);
       border-radius:10px;font:700 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
  .dig.on{background:var(--ok);border-color:var(--ok);color:#04150e}
  .linkbtn{background:none;border:none;color:var(--accent);font-size:13px;padding:10px 0 0;font-weight:600;width:100%}
  .missbtn{width:100%;min-height:48px;margin-top:12px;border:1px solid #4a2626;background:#1a1315;
           color:#f87171;border-radius:10px;font-size:14px;font-weight:700}
  .missbtn.confirm{background:var(--bad);border-color:var(--bad);color:#fff}

  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .photos a,.photos div.ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;
       background:#000;border:1px solid var(--line);display:block}
  .photos img{width:100%;height:100%;object-fit:cover}
  .addbtn{width:100%;min-height:var(--tap);border:1px dashed var(--line);background:transparent;
          color:var(--accent);border-radius:10px;font-size:15px;font-weight:600;margin-top:10px}

  .bar-bottom{position:fixed;left:0;right:0;bottom:0;background:#0f1115f5;border-top:1px solid var(--line);
        padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px;z-index:30}
  .btn{flex:1;min-height:var(--tap);border-radius:11px;border:none;font-size:16px;font-weight:700}
  .btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
  .btn.pri{background:var(--ok);color:#04150e}
  .btn:disabled{opacity:.55}
  .btn.pri:disabled{background:#2a3139;color:#6d7782;opacity:1}

  .empty{text-align:center;color:var(--dim);padding:46px 20px;font-size:15px}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#000e;
         border:1px solid var(--line);padding:11px 18px;border-radius:24px;font-size:14px;
         z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .toast{white-space:pre-line}          /* the sync bar lists one item per line */
  .kv{font-size:13px;color:var(--dim);margin-bottom:3px}
  .kv b{color:var(--txt);font-weight:600}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff5;border-top-color:#fff;
        border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}
  @keyframes r{to{transform:rotate(360deg)}}
  .modal{position:fixed;inset:0;z-index:80;background:#000a;backdrop-filter:blur(3px);
         display:flex;align-items:flex-end;justify-content:center}
  .mbox{width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);
        border-radius:16px 16px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}
  .mtitle{font-size:18px;font-weight:700;margin-bottom:4px}
  .msub{font:600 13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
        letter-spacing:.5px;margin-bottom:18px;word-break:break-all}
  .mbox input{margin-top:2px}
  .mbtns{display:flex;gap:9px;margin-top:16px}
  .hide{display:none}

  /* ---------- wider screens ----------
     Phone stays full-bleed. From tablet up the column is capped and centred so
     a card doesn't stretch across an iPad, and from laptop width the VIN list
     runs two-up because there is room for it. */
  .cards{display:grid;gap:9px}
  .cards .card{margin-bottom:0}

  @media (min-width:720px){
    header{padding:12px 0}
    .hrow,.tabs{max-width:760px;margin-left:auto;margin-right:auto;padding-left:18px;padding-right:18px}
    .tabs{margin-top:12px}
    main{max-width:760px;margin:0 auto;padding:16px 18px 104px}
    .bar-bottom{padding-left:max(18px,calc((100% - 760px)/2));
                padding-right:max(18px,calc((100% - 760px)/2))}
    .digits{max-width:460px;margin-left:auto;margin-right:auto}
    .baycode{font-size:34px}
    .modal{align-items:center}
    .mbox{border-radius:16px;border:1px solid var(--line)}
  }

  @media (min-width:1000px){
    .hrow,.tabs{max-width:980px}
    main{max-width:980px}
    .bar-bottom{padding-left:max(18px,calc((100% - 980px)/2));
                padding-right:max(18px,calc((100% - 980px)/2))}
    .cards{grid-template-columns:1fr 1fr;gap:11px}
  }

  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* ---- integrity marker: must be the last rule in this file ---- */
#title{ --css-ok: 1; }
</style>

</head>
<body>

<header>
  <div class="hrow">
    <h1 id="title">Yard Pre-Inspection</h1>
    <span class="who"></span>
    <button class="icon" id="refresh" onclick="refresh()" title="Refresh">⟳</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="vins">VINs <span id="cP"></span></button>
    <button class="tab" data-v="eval">Eval <span id="cD"></span></button>
  </div>
</header>

<main>
  <section id="listView"><div class="empty"><span class="spin"></span> Loading…</div></section>
  <section id="formView" class="hide"></section>
</main>

<div class="bar-bottom hide" id="bottom"></div>
<div class="toast" id="toast"></div>

<div class="modal hide" id="modal">
  <div class="mbox">
    <div class="mtitle" id="mtitle">Approve for shipping</div>
    <div class="msub" id="mvin"></div>
    <label class="lab" for="approver" id="mlabel">Who approved?</label>
    <input type="text" id="approver" placeholder="Full name" autocomplete="off"
           autocapitalize="words" oninput="checkApprover()">
    <div class="mbtns">
      <button class="btn sec" onclick="closeApprove()">Cancel</button>
      <button class="btn pri" id="approveGo" onclick="confirmName()" disabled>Confirm</button>
    </div>
  </div>
</div>


<style>
  /* Read-only: no save bar, no missing button, no photo upload, no eval action. */
  body.ro .bar-bottom, body.ro .missbtn, body.ro .addbtn,
  body.ro .seg button, body.ro .dig, body.ro .linkbtn { pointer-events:none; opacity:.45 }
  body.ro .bar-bottom, body.ro .missbtn, body.ro .addbtn { display:none !important }
  body.noeval #bottom { display:none !important }
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* =====================================================================
   Telegram Mini App shell.
   Paste your Apps Script /exec URL below — that is the only edit needed.
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxZf6YWZ01-v1tA_UNmuYi-FVhW-yIC0Iw3NYHnZ0AII0SSgqFqI-_wHjWejqfDYB0G6g/exec";

/* Stamped when this file was built. It is the only way to tell, from a phone
   in a yard, whether the app it is running is the one you just uploaded. */
window.BUILD_STAMP = "Sep 04 13:26";

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  // Without this, a downward scroll inside the app closes it. Bot API 7.7+.
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  try { tg.setHeaderColor('#0f1115'); tg.setBackgroundColor('#0f1115'); } catch (e) {}

  /* Deep link: t.me/<bot>/<app>?startapp=load_201032  /  ...?startapp=vin_W1Z...
     Read it from BOTH places. initDataUnsafe.start_param is the documented
     one, but it is only filled reliably on a cold launch — tap a link while
     the app is still open in the background and Telegram resumes the old
     instance with a stale or empty value. The URL that Telegram actually
     loaded carries tgWebAppStartParam, and that is always the current one. */
  const fromUrl = () => {
    try {
      const src = (location.hash || '').slice(1) + '&' + (location.search || '').slice(1);
      const m = src.match(/(?:^|&)tgWebAppStartParam=([^&]*)/);
      return m ? decodeURIComponent(m[1]) : '';
    } catch (e) { return ''; }
  };
  const sp = fromUrl() || (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (/^load[_-]/i.test(sp))     window.__TG_LOAD = sp.replace(/^load[_-]/i, '');
  else if (/^vin[_-]/i.test(sp)) window.__TG_VIN  = sp.replace(/^vin[_-]/i, '').toUpperCase();
  // An 'Approve Eval' / 'Send Eval Email' button: open that van AND raise
  // the dialog it was pressed for.
  else if (/^(sup|oem|eml)[_-]/i.test(sp)) {
    window.__TG_ACT = sp.slice(0, 3).toLowerCase();
    window.__TG_VIN = sp.slice(4).toUpperCase();
  }
}

let ROLES = { view: true, inspect: true, eval: true };

/**
 * The whole operations group can open a load; only named people can change
 * one. The server refuses either way — this just stops someone being offered
 * a button that is going to say no.
 */
function paintRoles() {
  document.body.classList.toggle('ro', !ROLES.inspect);
  document.body.classList.toggle('noeval', !ROLES.eval);
}

/**
 * One POST per call, text/plain so the browser sends no preflight — an Apps
 * Script web app answers a preflight OPTIONS with nothing and the call dies.
 * The body is still JSON; the server parses it by hand.
 */
function callApi(fn, args, ok, fail) {
  /* Every call records what actually came back, because when this fails it
     fails on a phone in a yard where nobody can open a console. NET holds the
     last answer: status, content type, how long, and the first scrap of the
     body. Tap the title three times to read it. */
  const t0 = Date.now();
  const net = { fn: fn, status: 0, type: '', ms: 0, snip: '', at: new Date() };

  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], initData: tg ? tg.initData : '' })
  })
  .then(r => {
    net.status = r.status;
    net.type = String(r.headers.get('content-type') || '').split(';')[0];
    return r.text();
  })
  .then(t => {
    net.ms = Date.now() - t0;
    net.snip = String(t || '').replace(/\s+/g, ' ').slice(0, 160);
    window.NET = net;
    let d;
    try { d = JSON.parse(t); }
    catch (e) {
      /* Apps Script sometimes answers with an HTML page rather than data — a
         sign-in page, "unable to open the file at this time", or a transient
         Google error. That is a connection problem, NOT a rejected request:
         say so clearly, so the outbox retries it instead of binning the
         supervisor's work. */
      throw new Error('CONNECTION: got a page, not data — HTTP ' + net.status +
                      ' ' + (net.type || '?') + ' — ' + net.snip);
    }
    if (d.ok) ok(d.data); else fail({ message: d.error || 'Request failed' });
  })
  .catch(e => {
    if (!net.ms) net.ms = Date.now() - t0;
    window.NET = net;
    const m = String((e && e.message) || '');
    // status 0 with nothing read means the request never completed at all —
    // a different failure from Google answering with the wrong thing.
    fail({ message: /^CONNECTION:/.test(m) ? m
         : 'CONNECTION: ' + (m || 'no answer') +
           ' — HTTP ' + net.status + ' after ' + net.ms + 'ms' });
  });
}

/**
 * What the app is, and what the last call to the server did. Three taps on
 * the title. It is the only way to see any of this from a phone.
 */
function diagText() {
  const n = window.NET;
  const L = [];
  L.push('Build ' + (window.BUILD_STAMP || '?'));
  L.push('initData ' + (tg && tg.initData ? tg.initData.length + ' chars' : 'MISSING'));
  L.push('online: ' + (navigator.onLine === false ? 'no' : 'yes'));
  L.push('');
  if (!n) { L.push('No server call has completed yet.'); }
  else {
    L.push('Last call: ' + n.fn);
    L.push('HTTP ' + n.status + ' ' + (n.type || '?') + ' in ' + n.ms + 'ms');
    L.push(n.snip ? n.snip : '(empty body — request never completed)');
  }
  return L.join('\n');
}

/* Stand in for google.script.run.
   Each .withSuccessHandler() returns a FRESH chain rather than mutating a
   shared one, so two calls in flight at once cannot steal each other's
   handlers — which is exactly what happens while several photos upload. */
function newChain(ok, fail) {
  return new Proxy({}, { get: (t, fn) => {
    if (fn === 'withSuccessHandler') return f => newChain(f, fail);
    if (fn === 'withFailureHandler') return f => newChain(ok, f);
    return function () {
      const args = [].slice.call(arguments);
      const done = fn === 'apiBootstrap'
        ? d => {                                 // the static page has no scriptlets,
            if (d.options) OPT = d.options;      // so config arrives with the first call
            if (d.roles) { ROLES = d.roles; paintRoles(); }
            // Telegram's verified name, not a typed one.
            if (d.user) { try { setMe(d.user); } catch (e) {} }
            ok(d);
          }
        : ok;
      callApi(fn, args, done, fail);
    };
  } });
}
window.google = { script: { run: newChain(() => {}, () => {}) } };
</script>

<script>
const LANE_MAX = 51;
const POS_MAX  = 99;

let S = {
  view:'vins', sort:'bay', q:'', bayFree:false, homeYard:'',
  evalMode:false, unlocked:false, showApproved:false, nameKind:'', nameRole:'',
  pendingAction:'',            // set by an 'Approve Eval' button in Telegram
  rows:[], loads:[], counts:{}, current:null, pendingPhotos:0, confirmMissing:false,
  // Sort-by-load in the VIN tab opens every load. This holds the ones he has
  // folded shut, so a load stays closed while he works the rest of the list.
  collapsed:{}
};

/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
function toast(m, ms=2200){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'), ms); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function driveId(u){ const m=String(u).match(/[-\w]{25,}/); return m?m[0]:''; }
function thumb(u){ const id=driveId(u); return id?('https://drive.google.com/thumbnail?id='+id+'&sz=w400'):u; }
function bay(r){ return r.bayActual || r.baySheet || ''; }

/** "Sep 2, 16:41" — the same shape the server writes, made on the phone. */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function nowStamp(){
  const d = new Date();
  return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' +
         String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
const pad2 = n => String(n).padStart(2,'0');
const resolved = r => r.status==='DONE' || r.status==='MISSING';
const hidden   = r => r.status==='REMOVED' || r.status==='OFF-SITE';

/**
 * Bay = LANE + L + POSITION. The yard sheet carries only the first 4
 * characters (04L3) — the position's last digit is added on site.
 */
function parseBay(s){
  const t = String(s||'').toUpperCase().replace(/[^0-9L]/g,'');
  const m = t.match(/^(\d{1,2})L(\d{1,2})$/);
  if(!m) return null;
  const lane = +m[1], posRaw = m[2];
  const partial = posRaw.length < 2;
  return {
    lane, posRaw, partial,
    pos: +posRaw,
    code: pad2(lane)+'L'+posRaw,
    // a partial "3" means somewhere in 30–39; sort it at the head of that block
    sortPos: partial ? +(posRaw+'0') : +posRaw,
    ok: lane>=0 && lane<=LANE_MAX && (partial || (+posRaw>=1 && +posRaw<=POS_MAX))
  };
}
function bayDisplay(s){ const p=parseBay(s); return p ? (p.code + (p.partial?'_':'')) : (s||''); }
function natKey(s){ return String(s||'').toUpperCase().replace(/(\d+)/g, m => m.padStart(8,'0')); }

function cmpBay(a,b){
  const A=parseBay(bay(a)), B=parseBay(bay(b));
  if(A && B) return (A.lane-B.lane) || (A.sortPos-B.sortPos) || a.vin.localeCompare(b.vin);
  if(A) return -1;
  if(B) return 1;
  const ra=bay(a), rb=bay(b);
  if(!ra && !rb) return a.vin.localeCompare(b.vin);
  if(!ra) return 1;
  if(!rb) return -1;
  return natKey(ra).localeCompare(natKey(rb)) || a.vin.localeCompare(b.vin);
}
function cmpLoad(a,b){
  const A=a.loadId||'\uffff', B=b.loadId||'\uffff';
  return natKey(A).localeCompare(natKey(B)) || cmpBay(a,b);
}
const COMPARE = { bay:cmpBay, load:cmpLoad };

/** In the Eval tab the reason it landed there is the useful label, not DONE. */
function evalTags(r){
  const t=(r.evalReasons||[]).map(x=>{
    if(x==='DAMAGE')  return '<span class="pill p-DAMAGE">DAMAGE</span>';
    if(x==='MISSING') return '<span class="pill p-MISSING">MISSING</span>';
    return '<span class="pill p-DOCS">DOCUMENTS</span>';
  });
  if(r.evalStatus==='REQUESTED') t.push('<span class="pill p-REQUESTED">EVAL REQUESTED</span>');
  if(r.evalStatus==='APPROVED')  t.push('<span class="pill p-APPROVED">APPROVED</span>');
  return t.join('');
}

/**
 * "Inspected by Antony · Sep 2, 14:20", nested under the VIN.
 * Shown wherever a finished VIN appears — the list, and inside a load.
 */
function inspectedLine(r){
  if(!resolved(r)) return '';
  if(!r.inspectedBy && !r.inspectedAt) return '';
  const what = r.status==='MISSING' ? 'Marked missing by ' : 'Inspected by ';
  return '<div class="insp">' + what +
         '<b>' + esc(r.inspectedBy || 'unknown') + '</b>' +
         (r.inspectedAt ? ' · ' + esc(r.inspectedAt) : '') + '</div>';
}

function tagsFor(r){
  const t=[];
  if(r.status==='DONE') t.push('<span class="pill p-DONE">INSPECTED</span>');
  else if(r.status==='MISSING') t.push('<span class="pill p-MISSING">MISSING</span>');
  else if(r.status==='IN PROGRESS') t.push('<span class="pill p-PROGRESS">IN PROGRESS</span>');
  else if(r.status==='REMOVED') t.push('<span class="pill p-REMOVED">REMOVED</span>');
  else if(r.status==='OFF-SITE') t.push('<span class="pill p-OFFSITE">NOT AT '+esc(S.homeYard||'HOME YARD')+'</span>');
  else t.push('<span class="pill p-PENDING">PENDING</span>');
  if(r.damage==='YES') t.push('<span class="pill p-DAMAGE">DAMAGE</span>');
  if(r.evalStatus==='REQUESTED') t.push('<span class="pill p-REQUESTED">EVAL REQUESTED</span>');
  if(r.evalStatus==='APPROVED') t.push('<span class="pill p-APPROVED">APPROVED</span>');
  if(outboxHas(r.vin)) t.push('<span class="pill p-PROGRESS">WAITING TO SYNC</span>');
  return t.join('');
}

/* ---------- who is using this phone ----------
   Deployed "Execute as: Me", Google only hands the script the viewer's email
   when they share the owner's Workspace domain — for a personal account it is
   empty, so inspections were being saved with no name. Ask once, keep it here,
   send it with every save. Typed, so it is a record of who says they did the
   work, not proof. */
const MEK = 'yard.inspector';
function me(){ try { return localStorage.getItem(MEK) || ''; } catch(e){ return ''; } }
function setMe(n){
  n = String(n||'').trim().slice(0,60);
  if(!n) return false;
  try { localStorage.setItem(MEK, n); } catch(e){}
  paintMe();
  return true;
}
function paintMe(){
  const el = document.querySelector('.who');
  if(!el) return;
  el.textContent = me() || 'Sign in';
  el.title = 'Tap to change who is inspecting';
  el.onclick = () => askMe(true);
}
/** Blocks until a name is given, unless `optional` (tapping the header). */
function askMe(optional){
  const cur = me();
  const box = $('modal');
  $('mtitle').textContent = 'Who is inspecting?';
  $('mvin').textContent   = 'Saved on this phone. It is stamped on every inspection you complete.';
  $('mlabel').textContent = 'Your name';
  const inp = $('approver');
  inp.value = cur; inp.placeholder = 'Full name';
  $('approveGo').disabled = !cur.trim();
  $('approveGo').onclick = () => {
    if(setMe(inp.value)){ box.classList.add('hide'); resetModal(); }
  };
  box.classList.remove('hide');
  box.querySelector('.btn.sec').style.display = optional ? '' : 'none';
  setTimeout(()=>inp.focus(), 50);
}
/** Put the shared modal back to its eval-approval behaviour. */
function resetModal(){
  $('approveGo').onclick = confirmName;
  $('modal').querySelector('.btn.sec').style.display = '';
}

const dk = v => 'yard.draft.'+v;
function saveDraft(v,o){ try{ localStorage.setItem(dk(v), JSON.stringify(o)); }catch(e){} }
function loadDraft(v){ try{ return JSON.parse(localStorage.getItem(dk(v))||'null'); }catch(e){ return null; } }
function clearDraft(v){ try{ localStorage.removeItem(dk(v)); }catch(e){} }

/* ---------- data ---------- */
function refresh(){
  $('refresh').innerHTML='<span class="spin"></span>';
  google.script.run.withSuccessHandler(d=>{
    d = d || {};
    S.rows=d.rows||[]; S.loads=d.loads||[]; S.counts=d.counts||{}; S.homeYard=d.homeYard||'';
    // The server does not know about work that has not been sent yet. Without
    // this, a refresh wipes it off the screen: he signs a van in a dead zone,
    // the list refreshes, and the van he just finished is PENDING again.
    applyOutboxLocally();
    cacheSave(d);
    if(d.botLink) window.__BOT_LINK = d.botLink;
    paintCounts(d);
    $('refresh').innerHTML='⟳';
    if(!S.current) render();
    flushOutbox();
  }).withFailureHandler(e=>{
    $('refresh').innerHTML='⟳';
    // Fall back to what the phone already knows rather than an empty screen.
    // Say WHY. "Could not reach the server" reads the same for a dead zone
    // and for a server error, and the two need completely different actions.
    if(S.rows.length){
      const why = String((e && e.message) || 'no reason given');
      // A connection problem gets the plain line, plus the reason on a second
      // line. "Could not reach the server" reads the same for a dead zone and
      // for Google answering with a sign-in page, and those need completely
      // different actions — so say which one it was.
      toast(isNetworkProblem(e)
        ? 'Could not reach the server — showing the last list. It keeps trying.\n' + why
        : 'Server error — showing the last list.\n' + why, 7000);
    }
    else if(!hydrateFromCache(true)){
      $('listView').innerHTML='<div class="empty">'+esc(e.message)+'</div>';
    }
    paintSync();
  }).apiBootstrap(200);
}

function paintCounts(d){
  // Never let an odd response take the whole screen down — a half-painted
  // header is survivable, a thrown refresh leaves him on a spinner.
  const c = (d && d.counts) || {};
  $('cP').textContent='('+(c.pending||0)+')';
  $('cD').textContent='('+((c.evalOpen||0) + (c.evalRequested||0))+')';
}

/**
 * Rebuild each load's tallies from the rows the phone is holding.
 *
 * The server sends these with the bootstrap, so a load's progress bar only
 * moved after a full round trip — sign five of six vans in a dead zone and
 * the load still reads "1/6, 5 PENDING" while every row under it says
 * INSPECTED. The rows and the bar have to come from the same place.
 *
 * If the phone is holding fewer rows for a load than the server counted
 * (completed work is capped in the payload), the server's numbers are left
 * alone rather than guessed at.
 */
function recomputeLoads(){
  const by = {};
  S.rows.forEach(r=>{
    const id = (r.loadId||'').trim();
    if(!id || hidden(r)) return;                 // REMOVED / OFF-SITE are not ours to walk
    const L = by[id] || (by[id] = {total:0, done:0, pending:0, missing:0, damage:0});
    L.total++;
    if(resolved(r)) L.done++; else L.pending++;
    if(r.status==='MISSING') L.missing++;
    if(r.damage==='YES') L.damage++;
  });
  S.loads.forEach(l=>{
    const n = by[l.loadId];
    if(!n || n.total < l.total) return;
    l.total=n.total; l.done=n.done; l.pending=n.pending;
    l.missing=n.missing; l.damage=n.damage;
  });
}

/** Show the yard from the last good load. Returns false if there isn't one. */
/**
 * Paint the yard from the phone's copy.
 *
 * At boot this is just a head start — the real list lands a second later, so
 * saying "showing the yard as of 20 minutes ago" every single time the app
 * opens is noise that is wrong almost immediately. It is only worth saying
 * when the server could NOT be reached and the old copy is what he is stuck
 * with, which is the only place `announce` is set.
 */
function hydrateFromCache(announce){
  const c = cacheLoad();
  if(!c) return false;
  const d = c.d;
  S.rows=d.rows||[]; S.loads=d.loads||[]; S.counts=d.counts||{}; S.homeYard=d.homeYard||'';
  applyOutboxLocally();
  paintCounts(d);
  if(!S.current) render();
  if(announce) toast('No connection — showing the yard as of ' + cacheAgeText() + '.', 4000);
  return true;
}

function render(){
  if(S.view==='eval') renderEval();
  else renderVins();
}

/* ================= LOADS =================
   Loads live inside the VIN list, on "Sort by Load ID" — the load card with
   its progress, its VINs and its sign-off button, in the list he is already
   standing in. There is no separate Loads tab: it showed the same data one
   fold further away. */

/** Same fields the VIN list searches, so a load and its VINs agree. */
function vinMatch(r, q){
  if(!q) return true;
  return (r.vin+' '+r.loadId+' '+bay(r)+' '+bayDisplay(bay(r))+' '+r.pickup)
           .toUpperCase().includes(q);
}

function loadVins(loadId, q){
  return S.rows.filter(r=>r.loadId===loadId && !hidden(r) && vinMatch(r,q)).sort(cmpBay);
}

/** Open unless he folded it shut himself. */
function loadOpen(l){
  const c = S.collapsed[l.loadId];
  if(c !== undefined) return !c;                    // he folded it himself; leave it
  if(S.q.trim()) return true;                       // searching: show the hits
  // A load with nothing left to inspect still needs signing off, so it stays
  // open. Only what he has already signed folds away.
  return !l.signedOffAt;
}

function secHead(title, n){
  return '<div class="ghead"><span>'+title+'</span><span class="ln"></span>' +
         '<span class="n">'+n+'</span></div>';
}

function loadCard(l){
  const pct = l.total ? Math.round(l.done/l.total*100) : 0;
  const open = loadOpen(l);
  const vins = open ? loadVins(l.loadId, S.q.trim().toUpperCase()) : [];
  const state = l.signedOffAt ? 'signed' : (l.pending===0 && l.total>0 ? 'ready' : 'pending');

  const rows = vins.map(r=>`
    <div class="lvin" onclick="openVinFromLoad('${r.vin}',event)">
      <span class="lv-vin">${esc(r.vin)}</span>
      <span class="lv-sub">
        <span class="lv-bay">${esc(bayDisplay(bay(r))||'no bay')}</span>
        ${tagsFor(r)}
      </span>
      ${inspectedLine(r)}
    </div>`).join('');

  let action;
  if(l.signedOffAt){
    // The load's status has gone to the group. Since it now publishes itself
    // when the last van lands, nobody necessarily "signed" anything — this
    // says what actually happened.
    action = `<div class="signoff">✓ Load status sent ${esc(l.signedOffAt)}${l.signedOffBy?' · '+esc(l.signedOffBy):''}</div>`;
  } else if(l.pending===0 && l.total>0){
    action = `<button class="lcomplete go" onclick="completeLoad('${esc(l.loadId)}',event)">Mark Load Inspection Complete</button>`;
  } else {
    action = `<button class="lcomplete wait" disabled>${l.done} of ${l.total} inspected — finish them all first</button>`;
  }

  const chips = [
    l.pending ? `<span class="lchip c-pending">${l.pending} PENDING</span>`
              : `<span class="lchip c-ready">ALL INSPECTED</span>`,
    l.missing ? `<span class="lchip c-missing">${l.missing} MISSING</span>` : '',
    l.damage  ? `<span class="lchip c-damage">${l.damage} DAMAGED</span>` : ''
  ].filter(Boolean).join('');

  return `<div class="loadcard ${state} ${open?'open':''}">
    <div class="lhead" onclick="toggleLoad('${esc(l.loadId)}')">
      <div class="lrow">
        <span class="lid">${esc(l.loadId)}</span>
        <span class="lcount">${l.done}/${l.total}</span>
        <span class="caret">${open?'▲':'▼'}</span>
      </div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="lmeta">${chips}</div>
    </div>
    ${open?`<div class="lvins">${rows}${action}</div>`:''}
  </div>`;
}

/**
 * "Sort by Load ID": the load cards themselves, already open, so the whole
 * load — progress, the VINs, the sign-off button — is right there.
 */
/* How far along a load is, 0 to 1. The sort key for the whole list. */
function loadProgress(l){
  return (l && l.total) ? (l.done || 0) / l.total : 0;
}

/**
 * Nearest to finished, first.
 *
 * A load at 3/3 is one tap from closed, so it belongs at the top of the
 * screen — it used to sit at the bottom and have to be scrolled to, which is
 * exactly backwards. 1/1 and 3/3 both read 100% and rank together; 2/4 and
 * 1/2 both read half. An untouched load is 0% and sinks on its own, no
 * special case needed: the work starts in the bay-sorted VIN list, not here,
 * so a new load has nothing to offer until someone has walked part of it.
 *
 * Ties break oldest-first, which is how the server used to order everything.
 */
function byProgress(a, b){
  const d = loadProgress(b) - loadProgress(a);
  if(Math.abs(d) > 0.0001) return d;
  return (a.oldest || 0) - (b.oldest || 0);
}

function renderLoadGroups(){
  const q = S.q.trim().toUpperCase();
  const hit = l => !q || loadVins(l.loadId, q).length > 0;
  // Open work first — anything still being walked, plus anything walked but
  // not yet signed off. Signed loads drop to the bottom, out of the way.
  const open     = S.loads.filter(l=>!l.signedOffAt && hit(l)).sort(byProgress);
  const finished = S.loads.filter(l=>!!l.signedOffAt && hit(l));

  // Pending VINs on no load still have to be walked, so they keep a group.
  const orphans = S.rows
    .filter(r=>!r.loadId && !hidden(r) && (q ? vinMatch(r,q) : !resolved(r)))
    .sort(cmpBay);

  if(!open.length && !finished.length && !orphans.length){
    return '<div class="empty">'+(q?'Nothing matches that.':'Nothing pending here.')+'</div>';
  }
  return open.map(loadCard).join('') +
    (finished.length ? secHead('INSPECTED — STATUS SENT', finished.length)
                       + finished.map(loadCard).join('') : '') +
    (orphans.length ? secHead('NO LOAD ID', orphans.length)
                      + '<div class="cards">'+orphans.map(r=>vinCard(r,true)).join('')+'</div>' : '');
}

function toggleLoad(id){
  const l = S.loads.filter(function(x){ return x.loadId===id; })[0];
  S.collapsed[id] = (l ? loadOpen(l) : true);       // whatever it is now, flip it
  renderVins();
}

/** Tapping a VIN inside a load opens that VIN's inspection directly. */
function openVinFromLoad(vin, e){
  if(e) e.stopPropagation();
  openVin(vin);
}

function completeLoad(loadId, e){
  if(e) e.stopPropagation();
  const btn = e && e.target;
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Saving'; }
  mutate({
    fn:'apiCompleteLoad', args:[loadId, me()], vin:'',
    ok:(res, queued)=>{
      if(queued) toast('Load '+loadId+' signed off — waiting for signal to send it.', 4000);
      else toast('Load '+res.loadId+' signed off'+(res.missing?' · '+res.missing+' missing':''), 3000);
      refresh();
    },
    fail:err=>{
      if(btn){ btn.disabled=false; btn.textContent='Mark Load Inspection Complete'; }
      toast(err.message, 4000);
    }
  });
}

window.__P1 = 1;

<script>
/* ================= VINS ================= */
function vinCard(r, hideLoad, evalCtx){
  const head=r.vin.slice(0,11), tail=r.vin.slice(11);
  const b=bay(r);
  const loadFact = hideLoad ? '' :
    `<div class="fact" style="flex:1.1"><div class="k">LOAD ID</div>
       <div class="v ${r.loadId?'':'none'}">${esc(r.loadId||'— none —')}</div></div>`;
  return `<button class="card" onclick="openVin('${r.vin}')">
    <div class="vin">${esc(head)}<span class="t">${esc(tail)}</span></div>
    <div class="tags">${evalCtx ? evalTags(r) : tagsFor(r)}</div>
    ${inspectedLine(r)}
    <div class="facts">
      ${loadFact}
      <div class="fact" style="flex:1.2"><div class="k">BAY</div>
        <div class="v ${b?'mono':'none'}">${esc(bayDisplay(b)||'—')}</div></div>
      ${(r.evalStatus==='APPROVED' && r.approvedBy)
        ? `<div class="fact" style="flex:1.3"><div class="k">APPROVED BY</div><div class="v">${esc(r.approvedBy)}</div></div>`
        : (r.vanType
            ? `<div class="fact"><div class="k">VAN</div><div class="v">${esc(r.vanType)}</div></div>`
            : (r.modelCode
                ? `<div class="fact"><div class="k">MODEL</div><div class="v mono" style="font-size:12.5px">${esc(r.modelCode)}</div></div>`
                : ''))}
    </div></button>`;
}

function renderVins(){
  const q = S.q.trim().toUpperCase();

  const sortBtn = (k,label) => `<button class="${S.sort===k?'on':''}" onclick="setSort('${k}')">${label}</button>`;
  const controls = `
    <input class="search" id="q" placeholder="Search VIN, load, bay…" value="${esc(S.q)}" autocomplete="off">
    <div class="sortbar">${sortBtn('bay','Sort by Bay')}${sortBtn('load','Sort by Load ID')}</div>`;

  let list;
  if(S.sort==='load'){
    // The whole load, not just its unfinished VINs — progress and sign-off
    // only mean something against the full set.
    list = renderLoadGroups();
  } else {
    let rows = S.rows.filter(r=>{
      if(q) return true;                 // search spans every status, including done
      return !resolved(r) && !hidden(r);
    });
    if(q) rows = rows.filter(r=>vinMatch(r,q));
    rows = rows.slice().sort(cmpBay);
    list = rows.length
      ? `<div class="cards">${rows.map(r=>vinCard(r, false)).join('')}</div>`
      : `<div class="empty">Nothing pending here.</div>`;
  }

  $('listView').innerHTML = controls + list;
  $('q').oninput = e=>{
    S.q=e.target.value; const p=e.target.selectionStart;
    renderVins(); const n=$('q'); n.focus(); n.setSelectionRange(p,p);
  };
}

function setSort(s){ S.sort=s; renderVins(); }

/* ================= EVAL =================
   Everything here is already inspected, so the useful label is WHY it landed
   here — damage, missing, or a document marked NO. Three stages:
     1. Pending eval request   — nobody has raised it yet
     2. Pending shipping approval — eval requested, waiting on the coordinator
     3. Shipping approved      — cleared, collapsed out of the way            */
function renderEval(){
  const q = S.q.trim().toUpperCase();
  const match = r => !q || (r.vin+' '+r.loadId+' '+bay(r)+' '+bayDisplay(bay(r))+' '+r.damageNotes)
                            .toUpperCase().includes(q);
  const newest = (a,b)=>(b.inspectedAtMs||0)-(a.inspectedAtMs||0);

  const flagged  = S.rows.filter(r=>(r.evalReasons||[]).length && match(r));
  const stage1   = flagged.filter(r=>!r.evalStatus).sort(newest);
  const stage2   = flagged.filter(r=>r.evalStatus==='REQUESTED').sort(newest);
  const stage3   = flagged.filter(r=>r.evalStatus==='APPROVED').sort(newest);

  const search = `<input class="search" id="q" placeholder="Search VIN, load, bay…"
                         value="${esc(S.q)}" autocomplete="off">`;

  const section = (title, rows, empty) =>
    `<div class="ghead"><span>${title}</span><span class="ln"></span>
       <span class="n">${rows.length}</span></div>` +
    (rows.length ? `<div class="cards">${rows.map(r=>vinCard(r,false,true)).join('')}</div>`
                 : `<div class="empty" style="padding:22px 20px;font-size:14px">${empty}</div>`);

  const html =
    section('Pending eval request', stage1, 'No Pending Eval Requests') +
    section('Pending shipping approval', stage2, 'No Pending shipping approval') +
    (stage3.length ? `
      <button class="collapse ${S.showApproved?'open':''}"
              onclick="S.showApproved=!S.showApproved;renderEval()">
        <span>Shipping approved</span>
        <span class="cn">${stage3.length}</span>
        <span class="cv">${S.showApproved?'▲':'▼'}</span>
      </button>
      ${S.showApproved ? `<div class="cards">${stage3.map(r=>vinCard(r,false,true)).join('')}</div>` : ''}` : '');

  $('listView').innerHTML = search + html;
  $('q').oninput = e=>{
    S.q=e.target.value; const p=e.target.selectionStart;
    renderEval(); const n=$('q'); n.focus(); n.setSelectionRange(p,p);
  };
}

/* ==================================================================
   THE RECORD OF A FINISHED VAN

   Once a van has been Marked Inspected it stops being a form. This is
   what he sees instead — what was found, who found it, when — whether
   he reached it from the VIN list, a load, or the Eval tab.

   Unlock Inspection is the way back to the checklist. That is the whole
   point: the editable form was previously one tap away with "Mark
   complete" live under his thumb, and pressing it again re-sent the
   alert to the group.
   ================================================================== */
const REASON_TEXT = {
  DAMAGE:'Damage was found during inspection',
  MISSING:'The van was not in the yard',
  DOCUMENTS:'A required document is missing'
};

function renderInspected(){
  const r = S.current;
  const flagged = (r.evalReasons||[]).length > 0;
  const bad = v => v && v!=='YES';
  const doc = (label, v) =>
    `<tr><td>${label}</td><td class="${bad(v)?'bad':(v?'':'none')}">${esc(v||'—')}</td></tr>`;
  const row = (label, v) =>
    `<tr><td>${label}</td><td class="${v?'':'none'}">${esc(v||'—')}</td></tr>`;

  $('formView').innerHTML = `
    <button class="back" onclick="backToList()">‹ Back</button>

    <div class="grp">
      <div class="vin" style="font-size:20px">${esc(r.vin)}</div>
      <div class="tags">${flagged ? evalTags(r) : tagsFor(r)}</div>
      <div class="facts" style="margin-top:11px">
        <div class="fact" style="flex:1"><div class="k">LOAD ID</div>
          <div class="v ${r.loadId?'':'none'}">${esc(r.loadId||'— none —')}</div></div>
        <div class="fact" style="flex:1"><div class="k">BAY</div>
          <div class="v ${bay(r)?'mono':'none'}">${esc(bayDisplay(bay(r))||'—')}</div></div>
      </div>
    </div>

    ${flagged ? `
      <div class="why">
        <h5>Why it's here</h5>
        <ul>${(r.evalReasons||[]).map(x=>`<li>${REASON_TEXT[x]||x}</li>`).join('')}</ul>
      </div>` : ''}

    <div class="grp">
      <div class="lab">Inspection result</div>
      <table class="rtab">
        ${doc('Monroney', r.monroney)}
        ${doc('Gatepass', r.gatepass)}
        ${row('Van type', r.vanType)}
        ${row('Lifted', r.lifted)}
        ${row('Roof', r.roof)}
        ${row('AC', r.ac)}
        <tr><td>Damage</td><td class="${r.damage==='YES'?'bad':(r.damage?'':'none')}">${esc(r.damage||'—')}</td></tr>
      </table>
      ${r.damageNotes?`<div class="kv" style="margin-top:12px">Notes <b>${esc(r.damageNotes)}</b></div>`:''}
      ${r.inspectedBy?`<div class="kv" style="margin-top:8px">Inspected by <b>${esc(r.inspectedBy)}</b> ${esc(r.inspectedAt)}</div>`:''}
      ${r.evalRequestedBy?`<div class="kv">Eval requested by <b>${esc(r.evalRequestedBy)}</b> ${esc(r.evalAt)}</div>`:''}
      ${r.approvedBy?`<div class="kv">Approved by <b>${esc(r.approvedBy)}</b> ${esc(r.evalAt)}</div>`:''}
    </div>

    ${(r.photoLinks||[]).length?`
      <div class="grp">
        <div class="lab">Photos (${r.photoCount||0})</div>
        <div class="photos">${r.photoLinks.map(u=>
          `<a href="${esc(u)}" target="_blank"><img src="${esc(thumb(u))}" loading="lazy"></a>`).join('')}</div>
      </div>`:''}

    ${flagged && !r.evalStatus
      ? `<button class="linkbtn" onclick="askName('REQUESTED')">Request an evaluation</button>` : ''}`;

  // Unlock is always the right-hand button. A flagged van gets the approval
  // beside it; a clean one needs nothing else, so Unlock fills the bar.
  $('bottom').innerHTML =
    (flagged ? `<button class="btn sec" onclick="askName('APPROVED')">Approve for shipping</button>` : '') +
    `<button class="btn pri" onclick="unlockInspection()">Unlock Inspection</button>`;
}

/** Drop back into the editable checklist to redo or add to the inspection. */
function unlockInspection(){
  S.unlocked = true;
  renderForm();
  toast('Inspection unlocked — Mark Inspected when you’re done', 2800);
}

function cancelEdits(){
  const vin = S.current.vin;
  clearDraft(vin);
  S.unlocked = false;
  openVin(vin);                      // reload, so the review shows what is actually saved
}

/**
 * Save an edit made from the Eval review screen, then go back to that review.
 * A fully answered checklist marks the VIN DONE; a partial edit leaves the
 * status alone, so a MISSING van stays MISSING while its notes get corrected.
 */
function saveEdits(){
  const r = S.current;
  // Photos do not hold this up — they are queued ahead of it and land first.

  const full = !!((r.bayActual||'').trim() && r.monroney && r.gatepass
                  && r.vanType && r.lifted && r.roof && r.ac && r.damage);
  const btn = $('saveEditsBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving';

  const localFresh = Object.assign({}, r, {
    status: full ? 'DONE' : (r.status==='PENDING' ? 'IN PROGRESS' : r.status),
    inspectedBy: me(),
    inspectedAt: nowStamp()
  });
  mutate({
    fn:'apiSave', vin:r.vin,
    args:[Object.assign({}, r, {actor: me()}, full ? {complete:true} : {keepStatus:true})],
    ok:(server, queued)=>{
      const fresh = queued ? localFresh : server;
      if(queued) patchLocal(fresh.vin, localFresh);
      clearDraft(fresh.vin);
      S.current = fresh;
      S.unlocked = false;
      if((fresh.evalReasons||[]).length){
        toast('Inspection updated', 2200);
        renderForm();                 // back to the review screen
      } else {
        // the correction cleared every reason, so it no longer belongs in Eval
        toast('…'+fresh.vin.slice(-6)+' cleared — no longer under evaluation', 3200);
        backToList();
      }
    },
    fail:e=>{
      btn.disabled = false; btn.textContent = 'Mark Inspected';
      toast('Save failed: '+e.message, 4000);
    }
  });
}

/* ---- one prompt, several questions ----
   `role` is set when the request came from a button in Telegram, so the sheet
   records not just who cleared the van but in what capacity. Either role
   clears it: the van leaves the pending sections of Eval either way. */
const ROLE_LABEL = { sup:'Yard Supervisor', oem:'OEM Coordinator' };

function askName(kind, role){
  S.nameKind = kind;
  S.nameRole = role || '';
  const rl = ROLE_LABEL[S.nameRole] || '';
  $('mtitle').textContent = kind==='APPROVED'
    ? (rl ? 'Approve — ' + rl : 'Approve for shipping')
    : 'Request evaluation';
  $('mlabel').textContent = kind==='APPROVED'
    ? (rl ? 'Your name (' + rl + ')' : 'Who approved?')
    : 'Who requested the evaluation?';
  $('approveGo').textContent = kind==='APPROVED' ? 'Approve' : 'Confirm request';
  $('mvin').textContent = S.current.vin;
  const i = $('approver');
  // Inside Telegram the name is already known and verified, so he confirms
  // rather than types. In a browser it is still a blank field.
  i.value = (S.nameRole && me()) ? me() : '';
  $('approveGo').disabled = !i.value.trim();
  $('modal').classList.remove('hide');
  setTimeout(()=>i.focus(), 60);
}
function checkApprover(){ $('approveGo').disabled = !$('approver').value.trim(); }
function closeApprove(){ $('modal').classList.add('hide'); }

function confirmName(){
  let name = $('approver').value.trim();
  if(!name) return;
  if(!S.current || !S.current.vin){ toast('No VIN is open', 3000); return; }
  // "Anton Balta (Yard Supervisor)" — the capacity travels with the name, so
  // the sheet says who cleared it and on whose authority without a new column.
  if(S.nameRole && ROLE_LABEL[S.nameRole]) name += ' · ' + ROLE_LABEL[S.nameRole];
  const vin = S.current.vin, kind = S.nameKind;
  const go = $('approveGo');
  const label = go.textContent;
  go.disabled = true; go.innerHTML = '<span class="spin"></span> Saving';

  mutate({
    fn:'apiSetEval', args:[vin, kind, name, me()], vin:vin,
    ok:(r, queued)=>{
      closeApprove();
      go.textContent = label;
      if(queued) patchLocal(vin, {evalStatus: kind});
      toast((kind==='APPROVED'
        ? '…'+vin.slice(-6)+' approved for shipping by '+name
        : 'Evaluation requested for …'+vin.slice(-6)+' by '+name)
        + (queued ? ' — waiting for signal' : ''), 3000);
      backToList();
    },
    fail:e=>{
      go.disabled = false; go.textContent = label;
      toast('Failed: '+e.message, 4000);
    }
  });
}

$('tabs').onclick = e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  b.classList.add('on');
  S.view=b.dataset.v; S.q=''; S.showApproved=false;
  render(); window.scrollTo(0,0);
};


/* ---- integrity marker: must be the last line in this file ---- */
window.__P2 = 1;
</script>

<script>
/* ================= DETAIL ================= */
function openVin(vin){
  // apiGet returns exactly the object the bootstrap already sent for this VIN,
  // so going back to the server here bought nothing and cost a round trip on
  // a phone in a yard. Open from what we are holding, then quietly re-check.
  const cached = cachedRow(vin);
  if(cached) { paintVin(cached); }
  else {
    $('formView').innerHTML='\x3cdiv class="empty">\x3cspan class="spin">\x3c/span> Loading '+esc(vin)+'…\x3c/div>';
    showForm(true);
  }

  google.script.run.withSuccessHandler(r=>{
    if(!r || !r.vin){                       // no row, or one that came back malformed
      if(!cached){ toast('VIN ' + vin + ' is not in the sheet', 5000); showForm(false); }
      return;
    }
    if(S.current && S.current.vin !== vin) return;      // moved on already
    if(cached && JSON.stringify(r) === JSON.stringify(cached)) return;
    patchLocal(vin, r);
    if(!S.unlocked) paintVin(r);                        // don't stamp on an edit in progress
  }).withFailureHandler(e=>{
    if(!cached){ toast('Could not open ' + vin + ': ' + e.message, 5000); showForm(false); }
  }).apiGet(vin);
}

/**
 * The answer options are baked into the page by Apps Script, but in the
 * Telegram build they arrive with the first bootstrap response. A deep link
 * fetches its VIN far faster than that, so the form can be asked to draw
 * before it knows what buttons to draw. Wait for them rather than throwing.
 */
function optionsReady(){ return !!(OPT && OPT.docState && OPT.docState.length); }

/** Put a VIN record on screen, drafts and all. */
function paintVin(r, waited){
  if(!optionsReady()){
    waited = (waited || 0) + 1;
    if(waited > 60){                      // ~9s, then draw with what we have
      toast('Still loading the checklist options…', 3000);
    } else {
      showForm(true);
      $('formView').innerHTML =
        '\x3cdiv class="empty">\x3cspan class="spin">\x3c/span> Loading ' + esc(r.vin) + '…\x3c/div>';
      setTimeout(function(){ paintVin(r, waited); }, 150);
      return;
    }
  }
  return paintVinNow(r);
}

function paintVinNow(r){
  r = Object.assign({}, r);
  const d = loadDraft(r.vin);
  if(d) Object.assign(r, d, {vin:r.vin, photoLinks:r.photoLinks, photoCount:r.photoCount,
                             loadId:r.loadId, status:r.status});
  S.current = r;

  // A bay that isn't lane/position shaped (LRNG and friends) is complete as
  // printed — carry it straight through as the actual bay.
  const sb = r.baySheet||'';
  if(!r.bayActual && sb && !parseBay(sb)) r.bayActual = sb;
  S.bayFree = !parseBay(sb);
  S.confirmMissing = false;
  /* A van that has been Marked Inspected opens as a record of what was
     found, not as a live form — and that is true whichever list he came
     from. Opening a finished van from the VIN list used to hand back the
     editable checklist with Mark Inspected live under his thumb, so one
     stray tap re-sent the whole alert to the group. Unfinished work is
     still just work: it opens as the checklist, as it always did. */
  S.evalMode = (r.status === 'DONE');
  S.unlocked = false;
  showForm(true);
  renderForm();
  runPendingAction();
}

/**
 * A button in the group message opens the app straight onto the van with the
 * right dialog already up. This is the moment the van is finally on screen,
 * so this is where that dialog opens — once, then the request is spent.
 */
function runPendingAction(){
  const act = S.pendingAction;
  if(!act || !S.current) return;
  S.pendingAction = '';
  if(act === 'eml'){
    toast('The evaluation email is not set up yet — nothing was sent.', 5000);
    return;
  }
  if(act === 'sup' || act === 'oem') askName('APPROVED', act);
}

function showForm(on){
  $('listView').classList.toggle('hide', on);
  $('formView').classList.toggle('hide', !on);
  $('bottom').classList.toggle('hide', !on);
  $('tabs').classList.toggle('hide', on);
  $('refresh').classList.toggle('hide', on);
  $('title').textContent = on ? 'Inspection' : 'Yard Pre-Inspection';
  window.scrollTo(0,0);
}

function seg(field, values, styleFor){
  if(!values || !values.length) return '';     // options not here yet
  const cur=S.current[field]||'';
  return '\x3cdiv class="seg">'+values.map(v=>{
    const x=styleFor?styleFor(v):'';
    return `\x3cbutton class="${cur===v?'on '+x:''}" onclick="setField('${field}','${v.replace(/'/g,"\\'")}')">${esc(v)}\x3c/button>`;
  }).join('')+'\x3c/div>';
}
function setField(f,v){
  const cleared = S.current[f]===v;
  S.current[f] = cleared ? '' : v;
  saveDraft(S.current.vin, S.current);
  renderForm();

  /* A VIN discrepancy is a claim about paperwork. It needs evidence, so the
     camera opens straight away rather than relying on someone remembering.
     Damage is NOT handled here — there he picks camera or gallery himself.

     Either way the shot goes into the outbox like every other photo and is
     sent in the background: he closes the camera, finishes the checklist and
     signs without waiting for anything. */
  if(!cleared && v==='VIN DISCREPANCY' && (f==='monroney' || f==='gatepass')){
    const label = f==='monroney' ? 'Monroney' : 'Gatepass';
    toast('Photograph the ' + label + ' and the VIN plate', 4200);
    // renderForm() above has already redrawn, so the photo section exists to
    // drop the shot into.
    if(cameraSupported()) openCamera();
    else { const el=$('file'); if(el) el.click(); }
  }
}
function setText(f,v){ S.current[f]=v; saveDraft(S.current.vin, S.current); }

/* ---------- bay: tap the missing last digit ---------- */
function bayField(r){
  const sheet = parseBay(r.baySheet);
  const cur   = parseBay(r.bayActual);

  if(S.bayFree || !sheet){
    return `\x3cinput type="text" id="bayFree" value="${esc(r.bayActual||r.baySheet||'')}"
                   placeholder="Bay location" oninput="setText('bayActual',this.value)">
            ${sheet?`\x3cbutton class="linkbtn" onclick="S.bayFree=false;renderForm()">← Back to the digit picker\x3c/button>`:''}
            ${missingButton()}`;
  }

  const prefix = pad2(sheet.lane)+'L'+sheet.posRaw;              // e.g. 04L3
  const picked = (cur && !cur.partial && cur.code.indexOf(prefix)===0) ? cur.posRaw.slice(-1) : null;
  const full   = picked!==null ? prefix+picked : null;
  const bad    = full ? !(+ (full.split('L')[1]) >= 1) : false;   // 04L00 is not a real position

  const digits = '0123456789'.split('').map(d=>
    `\x3cbutton class="dig ${picked===d?'on':''}" onclick="pickDigit('${d}')">${d}\x3c/button>`).join('');

  return `
    \x3cdiv class="baycode ${full?(bad?'wait':'done'):'wait'}">${esc(prefix)}${
      full ? esc(picked) : '\x3cspan class="miss">_\x3c/span>'}\x3c/div>
    \x3cdiv class="bayhint ${(!full||bad)?'warn':''}">${
      !full ? 'Sheet gives \x3cb>'+esc(prefix)+'\x3c/b> — tap the last digit.'
            : (bad ? 'Position 00 is not valid — pick another digit.' : 'Bay confirmed.')}\x3c/div>
    \x3cdiv class="digits">${digits}\x3c/div>
    \x3cbutton class="linkbtn" onclick="S.bayFree=true;renderForm()">Bay is different from the sheet\x3c/button>
    ${missingButton()}`;
}

function pickDigit(d){
  const s = parseBay(S.current.baySheet);
  if(!s) return;
  const full = pad2(s.lane)+'L'+s.posRaw+d;
  S.current.bayActual = (S.current.bayActual===full) ? '' : full;   // tap again to clear
  saveDraft(S.current.vin, S.current);
  renderForm();
}

/* ---------- missing ---------- */
function missingButton(){
  return S.confirmMissing
    ? `\x3cbutton class="missbtn confirm" onclick="markMissing()">Tap again — mark this VIN MISSING\x3c/button>`
    : `\x3cbutton class="missbtn" onclick="S.confirmMissing=true;renderForm()">Van not here — mark missing\x3c/button>`;
}

function markMissing(){
  const vin = S.current.vin;
  mutate({
    fn:'apiMarkMissing', args:[vin, '', me()], vin:vin,
    ok:(r, queued)=>{
      if(queued) patchLocal(vin, {status:'MISSING', inspectedBy:me(), inspectedAt:nowStamp()});
      clearDraft(vin);
      toast('…'+vin.slice(-6)+' marked MISSING'+(queued?' — waiting for signal':''), 2600);
      backToList();
    },
    fail:e=>{ S.confirmMissing=false; renderForm(); toast('Failed: '+e.message, 4000); }
  });
}

/** Running inside Telegram rather than a browser? */
function inTelegram(){ return typeof tg !== 'undefined' && !!tg; }


/**
 * The whole screen for a van that was not in its bay: what we know from the
 * yard sheet, and one way out if it turns up after all.
 */
function renderMissing(r){
  $('formView').innerHTML = `
    \x3cbutton class="back" onclick="backToList()">‹ Back\x3c/button>

    \x3cdiv class="grp">
      \x3cdiv class="vin" style="font-size:20px">${esc(r.vin)}\x3c/div>
      \x3cdiv class="tags">${tagsFor(r)}\x3c/div>
      \x3cdiv class="facts" style="margin-top:11px">
        \x3cdiv class="fact" style="flex:1">\x3cdiv class="k">LOAD ID\x3c/div>
          \x3cdiv class="v ${r.loadId?'':'none'}">${esc(r.loadId||'— none —')}\x3c/div>\x3c/div>
        \x3cdiv class="fact" style="flex:1">\x3cdiv class="k">BAY ON SHEET\x3c/div>
          \x3cdiv class="v ${r.baySheet?'mono':'none'}">${esc(bayDisplay(r.baySheet)||'—')}\x3c/div>\x3c/div>
      \x3c/div>
      \x3cdiv style="margin-top:10px">
        ${r.description?'\x3cdiv class="kv">Model \x3cb>'+esc(r.description)+'\x3c/b>\x3c/div>':''}
        ${r.inspectedBy?'\x3cdiv class="kv">Marked missing by \x3cb>'+esc(r.inspectedBy)+'\x3c/b> '+esc(r.inspectedAt||'')+'\x3c/div>':''}
      \x3c/div>
    \x3c/div>

    \x3cdiv class="grp" style="text-align:center;padding:22px 14px">
      \x3cdiv style="font-size:34px;line-height:1">🔍\x3c/div>
      \x3cdiv style="font-weight:700;font-size:17px;margin-top:8px">Not found in the yard\x3c/div>
      \x3cdiv class="bayhint" style="margin-top:8px">
        This van is not at its bay, so there is nothing to inspect.
        It is recorded and reported — no checklist needed.
      \x3c/div>
    \x3c/div>

    \x3cbutton class="addbtn" onclick="foundIt()">The van is here — reopen the inspection\x3c/button>`;

  $('bottom').innerHTML =
    '\x3cbutton class="btn pri" style="flex:1" onclick="backToList()">Done\x3c/button>';
}

/** It turned up. Put it back into the queue with the checklist. */
function foundIt(){
  const r = S.current;
  toast('Reopening ' + r.vin.slice(-6) + '…', 2000);
  mutate({
    fn:'apiSave', vin:r.vin,
    args:[Object.assign({}, r, {complete:false, actor: me()})],
    ok:(server, queued)=>{
      const fresh = queued ? Object.assign({}, r, {status:'IN PROGRESS'}) : server;
      if(queued) patchLocal(fresh.vin, {status:'IN PROGRESS'});
      S.current = fresh;
      renderForm();
    },
    fail:e=>toast('Could not reopen: '+e.message, 4000)
  });
}

/** Damage, or a VIN discrepancy, both need a picture. */
function needsPhotos(r){
  return r.damage==='YES' ||
         r.monroney==='VIN DISCREPANCY' || r.gatepass==='VIN DISCREPANCY';
}
function photoWhy(r){
  const d=[];
  if(r.monroney==='VIN DISCREPANCY') d.push('Monroney');

  if(!d.length) return '';

         d.join(' and ') + ' VIN\x3c/span>';
}

function renderForm(){
  if(S.evalMode && !S.unlocked) return renderInspected();

  // Nothing to inspect on a van that is not in its bay. Asking for documents

  const dmgStyle = v => v==='YES'?'bad':'no';

  $('formView').innerHTML = `
    \x3cbutton class="back" onclick="backToList()">‹ Back\x3c/button>

        \x3cdiv class="fact" style="flex:1">\x3cdiv class="k">LOAD ID\x3c/div>
          \x3cdiv class="v ${r.loadId?'':'none'}">${esc(r.loadId||'— none —')}\x3c/div>\x3c/div>
        \x3cdiv class="fact" style="flex:1">\x3cdiv class="k">BAY ON SHEET\x3c/div>
          \x3cdiv class="v ${r.baySheet?'mono':'none'}">${esc(bayDisplay(r.baySheet)||'—')}\x3c/div>\x3c/div>
      \x3c/div>

        ${r.destination?'\x3cdiv class="kv">Delivering to \x3cb>'+esc(r.destination)+'\x3c/b>\x3c/div>':''}
        ${r.pickup?'\x3cdiv class="kv">Pickup \x3cb>'+esc(r.pickup)+'\x3c/b>\x3c/div>':''}
        ${r.timesStaged>1?'\x3cdiv class="kv">Staged \x3cb>'+r.timesStaged+' times\x3c/b> — '+esc(String(r.loadHistory).split('\n').join(', '))+'\x3c/div>':''}
        ${r.inspectedBy?'\x3cdiv class="kv">Last saved by \x3cb>'+esc(r.inspectedBy)+'\x3c/b> '+esc(r.inspectedAt)+'\x3c/div>':''}
      \x3c/div>

      \x3cdiv class="docrow">\x3cdiv class="name">Gatepass\x3c/div>${seg('gatepass',OPT.docState,docStyle)}\x3c/div>

        ? '\x3cdiv class="bayhint" style="text-align:left">Pre-filled from model code \x3cb>'+esc(r.modelCode)+'\x3c/b> — confirm against the van.\x3c/div>' : ''}
    \x3c/div>

      \x3cdiv>\x3cdiv class="lab">Roof\x3c/div>${seg('roof',OPT.roof)}\x3c/div>
      \x3cdiv>\x3cdiv class="lab">AC\x3c/div>${seg('ac',OPT.ac,v=>v==='NO'?'no':'ok')}\x3c/div>
    \x3c/div>

    \x3cdiv class="grp">\x3cdiv class="lab">Damage\x3c/div>${seg('damage',OPT.damage,dmgStyle)}\x3c/div>

      \x3cdiv class="grp">
        \x3cdiv class="lab">Damage notes\x3c/div>
        \x3ctextarea id="notes" placeholder="What and where — e.g. dent driver rear quarter"
                  oninput="setText('damageNotes',this.value)">${esc(r.damageNotes||'')}\x3c/textarea>
      \x3c/div>
    \x3c/div>

    \x3cdiv id="photoBlock" class="${needsPhotos(r)?'':'hide'}">
      \x3cdiv class="grp">
        \x3cdiv class="lab">Photos (${r.photoCount||0})${photoWhy(r)}\x3c/div>
        \x3cdiv class="photos" id="photoGrid">${(r.photoLinks||[]).map(u=>
          `\x3ca href="${esc(u)}" target="_blank">\x3cimg src="${esc(thumb(u))}" loading="lazy">\x3c/a>`).join('')}\x3c/div>
        \x3cinput type="file" id="file" accept="image/\x2a" capture="environment" multiple
               class="hide" onchange="handleFiles(this.files)">

  $('bottom').innerHTML = (S.evalMode && S.unlocked)

    : `\x3cbutton class="btn sec" onclick="save(false)">Save draft\x3c/button>
       \x3cbutton class="btn pri" id="doneBtn" onclick="save(true)">Mark Inspected\x3c/button>`;

function backToList(){ closeApprove(); S.current=null; S.confirmMissing=false;
                       S.evalMode=false; S.unlocked=false;
                       showForm(false); refresh(); render(); }
