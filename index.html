<script>

/* ---------- photos ---------- */
function handleFiles(files){ [].slice.call(files).forEach(uploadOne); $('file').value=''; }

/* ==================================================================
   PHOTOS NEVER BLOCK ANYTHING

   A photo goes straight into the outbox and is sent in the background.
   Nothing on screen waits for it: the tile appears immediately, the
   inspection can be signed, and the supervisor can walk to the next van.

   The outbox is oldest-first and one at a time, so a van's photos are
   always sent before its inspection — which means the alert the group
   gets still arrives with the pictures attached, however long the phone
   spent out of signal.
   ================================================================== */

function uploadOne(file){
  const vin = S.current.vin;
  const ph  = newTile();
  resizeImage(file, 1600, 0.78)
    .then(dataUrl => sendPhoto_(dataUrl, file.name || 'photo.jpg', ph, vin))
    .catch(()=>{ ph.remove(); toast('Could not read image'); });
}

/** The placeholder tile a photo lives in until it reaches Drive. */
function newTile(){
  const grid = $('photoGrid');
  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.innerHTML = '\x3cdiv style="display:grid;place-items:center;height:100%">\x3cspan class="spin">\x3c/span>\x3c/div>';
  if(grid) grid.appendChild(ph);
  return ph;
}

/**
 * Queue one photo. Shared by the file picker and the in-app camera, so a
 * photo behaves the same however it was taken.
 */
function sendPhoto_(dataUrl, name, ph, vin){
  vin = vin || (S.current && S.current.vin);
  if(!vin){ ph.remove(); return; }

  if(queuedPhotoCount() >= MAX_PHOTOS){
    ph.remove();
    toast('The phone is holding ' + MAX_PHOTOS + ' photos already. Get back in ' +
          'signal to send them, then take the rest.', 6000);
    return;
  }

  ph.innerHTML = '\x3cimg src="' + dataUrl + '" style="opacity:.45">';
  // A name of our own making, so a photo re-sent after a timeout is
  // recognised on the server as the one already filed rather than a second copy.
  const unique = vin + '_' + Date.now() + '_' +
                 Math.random().toString(36).slice(2, 7) + '.jpg';

  enqueuePhoto(vin, dataUrl, unique,
    smaller => { ph.innerHTML = '\x3cimg src="' + smaller + '" style="opacity:.45">'; },
    id => {
      if(!id){ ph.remove(); return; }
      ph.dataset.q = id;               // photoLanded finds it again by this
      ph.title = 'Waiting to send';
      flushOutbox();                   // start now if there is signal
    });
}

/**
 * The flusher calls this when a queued photo has actually reached Drive
 * (or failed for good, with res === null). The tile may be long gone — he
 * may have signed the van and walked on — which is fine.
 */
function photoLanded(entry, res){
  const ph = document.querySelector('[data-q="' + entry.id + '"]');
  if(!res){
    if(ph) ph.innerHTML =
      '\x3cdiv style="color:#f87171;font-size:11px;padding:6px;text-align:center">Not saved\x3cbr>take it again\x3c/div>';
    return;
  }
  if(S.current && S.current.vin === entry.vin){
    S.current.photoCount = res.count;
    S.current.photoLinks = (S.current.photoLinks || []).concat([res.url]);
  }
  if(ph){
    ph.outerHTML = '\x3ca href="' + res.url + '" target="_blank">\x3cimg src="' +
                   thumb(res.url) + '">\x3c/a>';
  }
}

/** Shrink on the phone so uploads survive weak yard signal. */
function resizeImage(file, maxPx, quality){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader(); fr.onerror=reject;
    fr.onload=()=>{ shrinkDataUrl(fr.result, maxPx, quality).then(resolve, reject); };
    fr.readAsDataURL(file);
  });
}

/** Re-encode an image that is already a data URL. */
function shrinkDataUrl(dataUrl, maxPx, quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(); img.onerror=reject;
    img.onload=()=>{
      let w=img.width, h=img.height;
      const s=Math.min(1, maxPx/Math.max(w,h));
      w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.src=dataUrl;
  });
}

/* ---------- save ---------- */
function save(complete){
  const r=S.current;
  // A van nobody could find has no checklist to validate.
  if(complete && r.status==='MISSING'){
    toast('…'+r.vin.slice(-6)+' is already recorded as MISSING', 2600);
    return backToList();
  }
  if(complete){
    const missing=[];
    if(!(r.bayActual||'').trim()) missing.push('full bay location');
    if(!r.monroney||!r.gatepass) missing.push('documents');
    if(!r.vanType) missing.push('van type');
    if(!r.lifted) missing.push('lifted');
    if(!r.roof) missing.push('roof');
    if(!r.ac) missing.push('AC');
    if(!r.damage) missing.push('damage');
    if(missing.length){ toast('Still needed: '+missing.join(', '), 3500); return; }
    // Photos no longer hold this up. They are queued ahead of this save, so
    // they reach Drive first and the group's alert still carries them.
  }
  const waiting = outbox().filter(e => e.fn==='apiUploadPhoto' && e.vin===r.vin).length;
  const btn = complete ? $('doneBtn') : null;
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Saving'; }

  const localFresh = Object.assign({}, r, {
    status: complete ? 'DONE' : (r.status==='PENDING' ? 'IN PROGRESS' : r.status),
    inspectedBy: me(),
    inspectedAt: nowStamp()          // when he inspected it, not when it reached the server
  });

  mutate({
    fn:'apiSave', vin:r.vin,
    args:[Object.assign({}, r, {complete: !!complete, actor: me()})],
    ok:(server, queued)=>{
      const fresh = queued ? localFresh : server;
      if(queued) patchLocal(fresh.vin, localFresh);
      S.current=fresh;
      if(complete){
        clearDraft(fresh.vin);
        const tail = '…'+fresh.vin.slice(-6);
        let msg;
        if(waiting) msg = tail+' complete · '+waiting+' photo'+(waiting===1?'':'s')+
                          ' still to send — you can carry on';
        else if(queued) msg = tail+' complete — waiting for signal';
        else msg = 'Saved — '+tail+' complete';
        toast(msg, (waiting||queued) ? 4000 : 2200);
        setTimeout(backToList,420);
      } else {
        saveDraft(fresh.vin, fresh);
        toast(queued ? 'Draft kept on the phone' : 'Draft saved');
        renderForm();
      }
    },
    fail:e=>{
      if(btn){ btn.disabled=false; btn.textContent='Mark Inspected'; }
      toast('Save failed: '+e.message, 4000);
    }
  });
}



/* ==================================================================
   IN-APP CAMERA

   Telegram's WebView swaps every <input type="file"> for its own image
   picker and ignores capture="environment", so that route can never
   reach the camera. getUserMedia is a different door: it hands the page
   the video stream directly, and we draw a frame out of it. The picker
   is never involved.

   Telegram asks for camera permission the first time and, on some
   versions, every time — that is Telegram's behaviour, not something
   the page controls. If the stream is refused we say so and the file
   picker is still sitting there.
   ================================================================== */

let CAM = null;      // { stream, video, facing }

function cameraSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

function openCamera(facing){
  if(!S.current) return;
  if(!cameraSupported()){
    toast('This phone will not give the page a camera. Use Add photos.', 5000);
    return;
  }
  facing = facing || (CAM && CAM.facing) || 'environment';
  closeCamera(true);

  const wrap = document.createElement('div');
  wrap.id = 'camwrap';
  wrap.style.cssText =
    'position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column';
  wrap.innerHTML =
    '\x3cdiv style="flex:1;position:relative;overflow:hidden">' +
      '\x3cvideo id="camvid" playsinline autoplay muted ' +
        'style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">\x3c/video>' +
      '\x3cdiv id="camvin" style="position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;' +
        'text-align:center;color:#fff;font:600 13px/1.3 system-ui;text-shadow:0 1px 3px #000">\x3c/div>' +
      '\x3cdiv id="camstrip" style="position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;' +
        'overflow-x:auto">\x3c/div>' +
    '\x3c/div>' +
    '\x3cdiv style="display:flex;align-items:center;justify-content:space-between;padding:14px 22px;' +
      'padding-bottom:calc(14px + env(safe-area-inset-bottom));background:#000">' +
      '\x3cbutton id="camclose" style="background:none;border:0;color:#fff;font:600 16px system-ui">Done\x3c/button>' +
      '\x3cbutton id="camshot" aria-label="Take photo" style="width:74px;height:74px;border-radius:50%;' +
        'border:5px solid #fff;background:#fff3">\x3c/button>' +
      '\x3cbutton id="camflip" style="background:none;border:0;color:#fff;font:600 15px system-ui">Flip\x3c/button>' +
    '\x3c/div>';
  document.body.appendChild(wrap);
  document.getElementById('camvin').textContent =
    S.current.vin + '  ·  Bay ' + (S.current.bayActual || S.current.baySheet || '—');

  document.getElementById('camclose').onclick = () => closeCamera();
  document.getElementById('camshot').onclick  = takeShot;
  document.getElementById('camflip').onclick  = () =>
    openCamera(facing === 'environment' ? 'user' : 'environment');

  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
  }).then(stream => {
    const v = document.getElementById('camvid');
    if(!v){ stream.getTracks().forEach(t => t.stop()); return; }   // closed already
    v.srcObject = stream;
    CAM = { stream: stream, video: v, facing: facing };
  }).catch(err => {
    closeCamera(true);
    const denied = /NotAllowed|Permission/i.test(String(err && err.name));
    toast(denied
      ? 'Camera permission refused. Allow it for Telegram, or use Add photos.'
      : 'Could not open the camera: ' + (err && err.message ? err.message : err), 5500);
  });
}

function takeShot(){
  if(!CAM || !CAM.video || !CAM.video.videoWidth) return;
  try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('medium'); } catch(e){}

  const v = CAM.video;
  const c = document.createElement('canvas');
  const s = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight));
  c.width  = Math.round(v.videoWidth  * s);
  c.height = Math.round(v.videoHeight * s);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL('image/jpeg', 0.78);

  // A thumbnail in the strip so he can see what he has, without leaving.
  const strip = document.getElementById('camstrip');
  const t = document.createElement('img');
  t.src = dataUrl;
  t.style.cssText = 'height:54px;width:54px;object-fit:cover;border-radius:6px;border:2px solid #fff8';
  strip.appendChild(t);
  strip.scrollLeft = strip.scrollWidth;

  // Same path as a picked file: tile in the form, queued, sent in the background.
  sendPhoto_(dataUrl, 'camera.jpg', newTile(), S.current.vin);
}

function closeCamera(quiet){
  if(CAM && CAM.stream) CAM.stream.getTracks().forEach(t => t.stop());
  CAM = null;
  const w = document.getElementById('camwrap');
  if(w) w.remove();
  if(!quiet && S.current) renderForm();
}

window.__P4 = 1;
</script>

<script>
/* ==================================================================
   OFFLINE / POOR SIGNAL

   The yard is not a place with reliable signal. Three things here:

     1. The VIN list is cached on the phone, so the app opens showing
        the yard instead of a spinner.
     2. Anything the supervisor does that the server needs to hear
        about goes into an outbox if the network is not there, and is
        sent when it comes back. He is told it is waiting, never told
        it is saved when it isn't.
     3. Photos ride in the same outbox, with a hard cap — a phone
        gives a web page a few megabytes, not a few hundred.

   What this canNOT do: open cold with no signal at all. Google serves
   this page from inside a sandboxed frame that cannot register a
   service worker, so the page itself must be fetched. Offline here
   means "keeps working once open".
   ================================================================== */

const CACHE_KEY  = 'yard.cache';
const OUTBOX_KEY = 'yard.outbox';
const MAX_PHOTOS = 15;         // queued photos, not photos per VIN

/**
 * How long to wait for the server before giving up and queueing instead.
 *
 * navigator.onLine only knows whether the phone thinks it has a connection.
 * A yard dead zone shows a bar of signal and reports online, so the request
 * simply hangs — which is what had supervisors staring at a spinner. Stop
 * waiting, put it in the outbox, let him carry on.
 */
const TIMEOUT_MS = { apiUploadPhoto: 30000, apiCompleteLoad: 25000, _default: 15000 };

/* ---------- storage that never throws ---------- */
function lsGet(k, def){
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
  catch(e){ return def; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ return false; }               // quota, or storage disabled
}

/* ---------- last known state of the yard ---------- */
function cacheSave(d){ lsSet(CACHE_KEY, {t: Date.now(), d: d}); }
function cacheLoad(){
  const c = lsGet(CACHE_KEY, null);
  return (c && c.d) ? c : null;
}
function cacheAgeText(){
  const c = cacheLoad();
  if(!c) return '';
  const mins = Math.round((Date.now() - c.t) / 60000);
  if(mins < 1)  return 'just now';
  if(mins < 60) return mins + ' min ago';
  const h = Math.round(mins/60);
  return h + (h===1 ? ' hour ago' : ' hours ago');
}

/* ---------- the outbox ---------- */
function outbox(){ return lsGet(OUTBOX_KEY, []); }
function outboxSet(q){ return lsSet(OUTBOX_KEY, q); }
function outboxCount(){ return outbox().length; }
function outboxHas(vin){ return outbox().some(e => e.vin === vin); }

function queuedPhotoCount(){ return outbox().filter(e => e.fn === 'apiUploadPhoto').length; }

/** @return {string} the queue id, or '' if the phone had no room. */
function enqueue(entry){
  const q = outbox();
  entry.id = entry.id || ('q' + Date.now() + Math.random().toString(36).slice(2,7));
  entry.ts = Date.now();
  entry.stamp = entry.stamp || nowStamp();      // when he actually did it, not when it sent
  q.push(entry);
  if(!outboxSet(q)){
    if(entry.fn !== 'apiUploadPhoto'){
      toast("Phone storage is full — that one wasn't saved. Get back in signal and try again.", 5000);
    }
    return '';                              // photos retry smaller, see enqueuePhoto
  }
  paintSync();
  return entry.id;
}

/**
 * A photo into the outbox, shrinking it if the phone has no room.
 *
 * A browser gives a page a few megabytes, not a few hundred, so on a long
 * walk through a dead zone the queue fills. Rather than refusing the photo —
 * the one thing that must not be lost — take it at lower quality.
 *
 * @param {function(string)} onShrunk  told the data URL actually stored, so
 *                                     the thumbnail on screen matches
 * @param {function(string)} done      the queue id, or '' if it could not be kept
 */
function enqueuePhoto(vin, dataUrl, name, onShrunk, done){
  const steps = [null, {px:1200, q:0.6}, {px:900, q:0.45}];   // null = as taken

  const attempt = (i, url) => {
    const id = enqueue({ fn:'apiUploadPhoto', args:[vin, url, name], vin:vin });
    if(id){ if(i > 0) onShrunk && onShrunk(url); return done(id); }

    if(i + 1 >= steps.length){
      toast('This phone has no room left for photos. Get back in signal, then take it again.', 6000);
      return done('');
    }
    const s = steps[i + 1];
    shrinkDataUrl(url, s.px, s.q).then(smaller => attempt(i + 1, smaller))
                                 .catch(() => attempt(steps.length, url));
  };
  attempt(0, dataUrl);
}

/**
 * Called by the flusher the moment a queued photo actually reaches Drive,
 * so the tile on screen can stop being a placeholder. Defined in IndexJs4.
 */
function photoLandedSafe(entry, res){
  try { if(typeof photoLanded === 'function') photoLanded(entry, res); } catch(e){}
}
function dequeue(id){
  outboxSet(outbox().filter(e => e.id !== id));
  paintSync();
}

/* ---------- is this a lost connection, or a real error? ---------- */
/**
 * Is this a lost connection, or did the server genuinely reject the request?
 *
 * The difference decides whether the change is retried or thrown away, so
 * getting it wrong is expensive. Google answers a POST with an HTML page more
 * often than you would like — a sign-in page, "unable to open the file at
 * this time", a transient error. The browser then fails parsing it as JSON
 * and reports "Unexpected token '<'". That used to read as a real rejection,
 * and the supervisor's inspection was dropped with it.
 */
function isNetworkProblem(e){
  if(navigator.onLine === false) return true;
  const m = String((e && e.message) || e || '').toLowerCase();
  return [
    'connection', 'network', 'timeout', 'failed to fetch', 'offline',
    'internal error', 'load failed',
    // a page where data should have been
    'not valid json', 'unexpected token', '<!doctype', 'json parse',
    'unexpected end of input'
  ].some(s => m.indexOf(s) !== -1);
}

/* ==================================================================
   ONE PATH FOR EVERYTHING

   There is no "send it now" and no "send it later". Every change the
   supervisor makes goes into the outbox, and the outbox is the only
   thing that ever talks to the server — oldest first, one at a time.

   That ordering is the whole design. A van's photos are queued before
   its inspection, so they reach Drive first, so the alert the group
   gets always carries the full set. Not because we checked the signal
   — because it cannot happen in any other order.

   The only thing signal decides is which sentence he reads. If the
   change lands within a moment he is told it saved; if not he is told
   it is held on the phone and he carries on. Same machinery either way.
   ================================================================== */

/* How long to let a change try before telling him it is held on the phone.
   Long enough that a normal save reads "Saved" rather than "waiting", short
   enough that he is never standing at a van watching a spinner. */
const GRACE_MS = 1200;

const ACKS = {};               // queue id -> the screen waiting on that entry

/** Answer the screen once, whichever outcome gets there first. */
function ack_(id, how, a, b){
  const h = ACKS[id];
  if(!h) return;
  delete ACKS[id];
  try { h[how] && h[how](a, b); } catch(e){}
}

/**
 * One change, queued.
 *
 *   spec.fn     server function name
 *   spec.args   arguments
 *   spec.vin    what it is about, for the "waiting" tag
 *   spec.ok     (result, stillWaiting) — result is null while it waits
 *   spec.fail   (err) only for real server errors, never for lost signal
 */
function mutate(spec){
  const id = enqueue({ fn: spec.fn, args: spec.args, vin: spec.vin || '' });
  if(!id){
    spec.fail && spec.fail(new Error('Could not save on the phone either'));
    return;
  }
  ACKS[id] = { ok: spec.ok, fail: spec.fail };

  if(navigator.onLine === false){
    ack_(id, 'ok', null, true);            // no point pretending; say so now
  } else {
    setTimeout(() => ack_(id, 'ok', null, true), GRACE_MS);
  }
  flushOutbox();
}

/* ---------- sending what is waiting ---------- */
let flushing = false;
let flushSince = 0;
let flushCancel = null;      // abandons the attempt in flight
let failStreak = 0;          // consecutive failures, for backing off

/**
 * Give up on whatever is in flight and start again.
 *
 * He walks out of the dead zone with a request still hanging. Waiting out
 * its timeout before trying again wastes the signal he has just found, so
 * the moment the phone says it is back online we drop the old attempt and
 * start the queue over.
 *
 * Abandoning is safe: if the original lands anyway, the server recognises a
 * re-sent photo by its name and refuses to file it twice, and a repeated
 * save writes the same values it already holds.
 */
function restartFlush(){
  const c = flushCancel;
  flushCancel = null;
  flushing = false;
  if(c) c();
  flushOutbox();
}

/** In flight far longer than its own timeout — the phone has lost the call. */
function flushStuck(){
  return flushing && flushSince && (Date.now() - flushSince > 45000);
}

function flushOutbox(){
  if(flushStuck()) return restartFlush();
  if(flushing) return;
  const q = outbox();
  if(!q.length){ paintSync(); return; }
  if(navigator.onLine === false){ paintSync(); return; }

  flushing = true;
  flushSince = Date.now();
  paintSync();

  // Oldest first, and one at a time. That ordering is what keeps a van's
  // photos ahead of its inspection: by the time the save reaches the server
  // the pictures are already in Drive, so the group's alert carries them.
  const entry = q[0];
  let settled = false;
  const finish = (fn) => { if(settled) return; settled = true; clearTimeout(timer); fn(); };

  const done = (sent) => {
    flushing = false;
    flushCancel = null;
    if(sent){
      failStreak = 0;
      dequeue(entry.id);
      if(outboxCount()) flushOutbox();       // keep going
      else { toast('Everything is saved.', 2600); refresh(); }
    } else {
      failStreak++;
      paintSync();
      // Try again soon — he may only be in signal for the few seconds it
      // takes to drive past — but back off if it keeps failing, so a Google
      // outage is not met with a request every eight seconds for an hour.
      const wait = Math.min(120000, 8000 * Math.pow(2, Math.min(failStreak - 1, 4)));
      setTimeout(() => { if(navigator.onLine !== false) flushOutbox(); }, wait);
    }
  };

  const timer = setTimeout(() => finish(() => done(false)),
                           TIMEOUT_MS[entry.fn] || TIMEOUT_MS._default);
  flushCancel = () => finish(() => { flushing = false; paintSync(); });

  const run = google.script.run
    .withSuccessHandler(res => finish(() => {
      if(entry.fn === 'apiUploadPhoto') photoLandedSafe(entry, res);
      else if(res && res.vin){
        // The server's version of the row, with its real timestamp, replaces
        // the one we painted optimistically. Not S.current — he may have the
        // van open again and be part way through a change.
        patchRow_(res.vin, res);
        recomputeLoads();
        // Repaint, unless he is typing in the search box — rebuilding the list
        // under him would take the keyboard away mid-word.
        const q = document.getElementById('q');
        if(!S.current && !(q && document.activeElement === q)) render();
      }
      ack_(entry.id, 'ok', res, false);        // "saved", if anything is still listening
      done(true);
    }))
    .withFailureHandler(e => finish(() => {
      // A real server error would repeat forever. Drop it, and say so.
      if(isNetworkProblem(e)) return done(false);
      dequeue(entry.id);
      flushing = false;
      ack_(entry.id, 'fail', e);
      if(entry.fn === 'apiUploadPhoto'){
        photoLandedSafe(entry, null);
        toast('A photo for …' + String(entry.vin).slice(-6) + ' could not be saved: ' +
              e.message + ' — take it again.', 6000);
      } else {
        toast('One change could not be saved: ' + e.message, 5000);
      }
      if(outboxCount()) flushOutbox();
    }));
  run[entry.fn].apply(run, entry.args);
}

/* ---------- the "waiting to sync" bar ---------- */
/* No "are you sure you want to close?" prompt. The queue survives being
   closed and sends itself on the next open, so nagging him every time he
   leaves the app with a photo outstanding would cost more than it saves. */
function paintSync(){
  let el = document.getElementById('syncbar');
  const n = outboxCount();
  if(!n){ if(el) el.remove(); return; }

  if(!el){
    el = document.createElement('div');
    el.id = 'syncbar';
    el.style.cssText =
      'position:fixed;left:0;right:0;bottom:0;z-index:60;padding:9px 14px;' +
      'font:13px/1.35 system-ui,-apple-system,sans-serif;font-weight:600;' +
      'display:flex;align-items:center;justify-content:space-between;gap:10px;' +
      'padding-bottom:calc(9px + env(safe-area-inset-bottom))';
    document.body.appendChild(el);
  }
  // The save buttons live at the bottom of a form. Sit above them, not on top.
  const bar = document.getElementById('bottom');
  const lift = (bar && !bar.classList.contains('hide')) ? bar.offsetHeight : 0;
  el.style.bottom = lift + 'px';

  // Name what is waiting. "3 photos" is reassuring in a way "3 changes" is not.
  const photos = queuedPhotoCount();
  const other  = n - photos;
  const bits = [];
  if(photos) bits.push(photos + (photos === 1 ? ' photo' : ' photos'));
  if(other)  bits.push(other + (other === 1 ? ' inspection' : ' inspections'));

  const off = navigator.onLine === false;
  el.style.background = off ? '#78350f' : '#1e3a8a';
  el.style.color = '#fff';
  el.innerHTML =
    '<span>' + (off ? 'No signal — ' : 'Sending — ') + bits.join(' + ') +
    ' held on this phone</span>' + (off ? '' : '<span class="spin"></span>');
  // Tap: say exactly what is waiting and how long it has been, then try again.
  // Otherwise "3 photos held" is all anyone can ever know about a stuck queue.
  el.onclick = () => {
    const q = outbox();
    const name = { apiUploadPhoto:'photo', apiSave:'inspection',
                   apiMarkMissing:'missing', apiCompleteLoad:'load sign-off',
                   apiSetEval:'evaluation' };
    const lines = q.slice(0, 6).map(e=>{
      const mins = Math.round((Date.now() - (e.ts||Date.now()))/60000);
      return (name[e.fn] || e.fn) + ' ' + (e.vin ? '…'+String(e.vin).slice(-6) : '') +
             ' · ' + (mins < 1 ? 'just now' : mins + ' min');
    });
    if(q.length > 6) lines.push('and ' + (q.length-6) + ' more');
    toast(lines.join('\n') || 'Nothing waiting', 6000);
    if(navigator.onLine !== false) restartFlush();
  };
}

/* ---------- keep the list in step while work is still waiting ---------- */

/** One row in the list, without touching whatever form is open. */
function patchRow_(vin, patch){
  for(let i = 0; i < S.rows.length; i++){
    if(S.rows[i].vin === vin){ S.rows[i] = Object.assign({}, S.rows[i], patch); return true; }
  }
  return false;
}

function patchLocal(vin, patch){
  patchRow_(vin, patch);
  if(S.current && S.current.vin === vin) S.current = Object.assign({}, S.current, patch);
  recomputeLoads();          // the bar has to move with the rows under it
  cacheSave({rows: S.rows, loads: S.loads, counts: S.counts, homeYard: S.homeYard});
}

/**
 * Lay everything still waiting in the outbox back over the rows the server
 * just handed us.
 *
 * The server's answer is the truth about what it has been told — but it has
 * not been told about the vans sitting in the outbox. Replaying them keeps
 * the screen honest: server state, plus the work he has done since.
 */
function applyOutboxLocally(){
  outbox().forEach(e=>{
    const when = e.stamp || '';
    if(e.fn === 'apiSave'){
      const p = (e.args && e.args[0]) || {};
      if(!p.vin) return;
      patchRow_(p.vin, Object.assign({}, p, {
        status: p.complete ? 'DONE' : 'IN PROGRESS',
        inspectedBy: p.actor || me(),
        inspectedAt: when
      }));
    } else if(e.fn === 'apiMarkMissing'){
      patchRow_(e.args[0], {
        status: 'MISSING', inspectedBy: e.args[2] || me(), inspectedAt: when
      });
    } else if(e.fn === 'apiSetEval'){
      patchRow_(e.args[0], { evalStatus: e.args[1] });
    }
  });
  recomputeLoads();
}

/** The row this VIN already is, from what the phone is holding. */
function cachedRow(vin){
  for(let i = 0; i < S.rows.length; i++) if(S.rows[i].vin === vin) return S.rows[i];
  return null;
}

// Back in signal: drop whatever was hanging and use the window while it lasts.
window.addEventListener('online',  () => { paintSync(); restartFlush(); });
window.addEventListener('offline', paintSync);
setInterval(() => {
  if(!outboxCount() || navigator.onLine === false) return;
  if(flushStuck()) restartFlush(); else flushOutbox();
}, 20000);

/* ---------- coming back to the app ----------
   A phone suspends a page it cannot see: timers stop, a request in flight is
   frozen. So the moment the app is on screen again, pick up where we left
   off rather than waiting out the twenty-second heartbeat. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  paintSync();
  // Always restart rather than resume. A request that was in flight when the
  // phone suspended the page is not coming back — waiting out its timeout
  // wastes the first half minute of him being in signal again.
  if(outboxCount() && navigator.onLine !== false) restartFlush();
});

window.__P5 = 1;
</script>


<script>
/* ---------- boot ----------
   Each included file ends with a marker. If one of them did not paste in
   full, its whole <script> block fails to parse and its marker never runs,
   so we can say exactly which file to re-paste instead of hanging on
   "Loading...". */
(function () {
  var missing = [];
  try {
    var v = getComputedStyle(document.getElementById('title'))
              .getPropertyValue('--css-ok').trim();
    if (v !== '1') missing.push('IndexCss');
  } catch (e) { missing.push('IndexCss'); }
  if (!window.__P1) missing.push('IndexJs1');
  if (!window.__P2) missing.push('IndexJs2');
  if (!window.__P3) missing.push('IndexJs3');
  if (!window.__P4) missing.push('IndexJs4');
  if (!window.__P5) missing.push('IndexJs5');

  if (missing.length) {
    document.getElementById('listView').innerHTML =
      '<div style="font:15px/1.5 system-ui;padding:24px;color:#b91c1c">' +
      '<b>Incomplete paste.</b><br><br>These file(s) did not save in full:<br><br><b>' +
      missing.join('</b><br><b>') + '</b><br><br>' +
      'Open each one in the editor, select all, delete, paste again, save.</div>';
    return;
  }

  // If Google did tell us who this is (owner, or same Workspace domain),
  // take it and don't ask.
  // Inside Telegram the caller is already verified by the signature on
  // initData, and the server records that rather than anything typed here,
  // so the "Who is inspecting?" prompt would be theatre.
  if (!me() && SERVER_USER) setMe(SERVER_USER);
  paintMe();
  if (!me() && !tg) askMe(false);

  // Paint from the phone's copy first so the yard is on screen immediately,
  // then go and get the real thing.
  hydrateFromCache();
  paintSync();
  flushOutbox();

  // "Open load" from the bot: group the VIN list by load and filter to that
  // one, which is where a load now lives.
  if (INITIAL_LOAD) { S.sort = 'load'; S.q = INITIAL_LOAD; }
  refresh();
  if (INITIAL_ACT) S.pendingAction = INITIAL_ACT;
  if (INITIAL_VIN) openVin(INITIAL_VIN);
})();
</script>

<script>
/* Native chrome, layered on top without touching the app's own logic. */
if (tg) {
  // Telegram's own back arrow drives the same navigation as the in-page one.
  const _showForm = showForm;
  showForm = function (on) {
    _showForm(on);
    try { on ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
  };
  try { tg.BackButton.onClick(() => { if (S.current) backToList(); }); } catch (e) {}

  // A tick of feedback on the taps that matter most in gloves.
  const buzz = k => { try { tg.HapticFeedback[k](); } catch (e) {} };
  const _pickDigit = pickDigit;
  pickDigit = function (d) { buzz('selectionChanged'); return _pickDigit(d); };
  const _setField = setField;
  setField = function (f, v) { buzz('selectionChanged'); return _setField(f, v); };
  const _toast = toast;
  toast = function (m, ms) { buzz('impactOccurred'); return _toast(m, ms); };

  // Tapping the name does nothing here — identity is Telegram's, not typed.
  const who = document.querySelector('.who');
  if (who) who.onclick = null;

  // Fullscreen mode overlaps the status bar; keep the header clear of it.
  const inset = () => {
    const t = (tg.safeAreaInset && tg.safeAreaInset.top) ||
              (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || 0;
    document.querySelector('header').style.paddingTop = (10 + t) + 'px';
  };
  try { inset(); tg.onEvent('safeAreaChanged', inset); } catch (e) {}
}

/* Three taps on the title prints what this build is and what the last call to
   the server actually returned. Deliberately hidden — a supervisor will never
   find it by accident, and it is the only window into a phone in the field. */
(function () {
  const t = document.getElementById('title');
  if (!t) return;
  let n = 0, timer = null;
  t.addEventListener('click', function () {
    n++;
    clearTimeout(timer);
    timer = setTimeout(function () { n = 0; }, 900);
    if (n >= 3) { n = 0; toast(diagText(), 20000); }
  });
})();
</script>
